kind = "web"
previewPath = "/"
title = "AIs&Ears"
version = "1.0.0"
id = "artifacts/ais-and-ears"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23469

[services.development]
run = "pnpm --filter @workspace/ais-and-ears run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ais-and-ears", "run", "build" ]
publicDir = "artifacts/ais-and-ears/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23469"
BASE_PATH = "/"
