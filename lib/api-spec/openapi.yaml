openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: AIs&Ears API specification — paid-only xAI Grok realtime app
servers:
  - url: /api
    description: Base API path (proxied by Replit reverse proxy)
tags:
  - name: health
    description: Health operations
  - name: products
    description: Stripe product listing
  - name: checkout
    description: Whop checkout and session verification

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products with prices
      description: Returns all active Stripe products with their prices. Falls back to hardcoded tiers if DB/Stripe unavailable.
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"

  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Create Stripe checkout session
      description: |
        Creates a Stripe Checkout session (Path A) or returns a pre-configured Payment Link URL (Path B).
        `tier` must be one of: audio-monthly, full-monthly, audio-session, full-session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Bad request — missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkout/verify:
    get:
      operationId: verifyCheckout
      tags: [checkout]
      summary: Verify Whop membership and grant a paid session
      description: |
        Verifies a Whop membership and creates a DB session.
        - `membership_id` — Whop membership ID (mem_xxx), verified with Whop API.
        - `tier` — required tier identifier.
      parameters:
        - name: membership_id
          in: query
          required: false
          schema:
            type: string
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [audio-monthly, full-monthly, audio-session, full-session]
      responses:
        "200":
          description: Session verified and granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Invalid session, bad tier, or payment not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"
      required:
        - id
        - name
        - prices

    Price:
      type: object
      properties:
        id:
          type: string
        unit_amount:
          type: integer
        currency:
          type: string
        recurring:
          type: object
          nullable: true
          properties:
            interval:
              type: string
            interval_count:
              type: integer
        metadata:
          type: object
          nullable: true
          additionalProperties: true
      required:
        - id
        - unit_amount
        - currency

    ProductsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required:
        - data

    CheckoutRequest:
      type: object
      properties:
        tier:
          type: string
          enum: [audio-monthly, full-monthly, audio-session, full-session]
        successUrl:
          type: string
          description: Optional redirect URL after successful payment (mobile deep links supported)
        cancelUrl:
          type: string
          description: Optional redirect URL on payment cancellation
      required:
        - tier

    CheckoutResponse:
      type: object
      properties:
        url:
          type: string
        checkoutId:
          type: string
          description: Whop checkout configuration ID
        tier:
          type: string
      required:
        - url

    VerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
        tier:
          type: string
          enum: [audio-monthly, full-monthly, audio-session, full-session]
        sessionId:
          type: string
        expiresAt:
          type: string
          nullable: true
          description: ISO 8601 timestamp — null for subscription tiers
      required:
        - valid
        - tier
        - sessionId

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Optional human-readable detail
      required:
        - error
